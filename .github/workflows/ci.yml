name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "41 5 * * 1" # Weekly, so a new advisory fails the scans even when nothing changes

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # check-spec compares api/openapi.json with the base branch

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Lint
        env:
          BASE_REF: origin/${{ github.base_ref || 'main' }}
        run: make lint

  test:
    name: Test
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Test (Postgres through testcontainers)
        run: make test

  vuln:
    name: Vulnerabilities
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: govulncheck
        run: go tool govulncheck ./...

      - name: Build the image for the scan
        run: docker build -t commerce-backend:scan .

      - name: Grype on the image at high, with no allowlist
        uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
        with:
          image: commerce-backend:scan
          fail-build: true
          severity-cutoff: high
          output-format: table

      - name: Set up Node, for the SDK's install
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26

      - name: Install the SDK's packages
        working-directory: sdk
        run: npm ci --no-audit --no-fund

      - name: Grype on every package the SDK installs, at high, with no allowlist
        uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
        with:
          path: sdk
          fail-build: true
          severity-cutoff: high
          output-format: table

  fragment:
    name: Fragment
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build for amd64 and arm64
        run: docker buildx build --platform linux/amd64,linux/arm64 --output type=cacheonly .

      - name: Run the fragment as the platform does
        run: make fragment

  sdk:
    name: SDK
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: sdk
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Generate the types from api/openapi.json and type-check the sample
        run: npm run generate && npm run check
