version: 2

# Every ecosystem waits 7 days after a release before proposing it, and groups its routine updates
# into one pull request. Images are pinned by tag and digest; Dependabot updates both.
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      go-modules:
        patterns: ["*"]
        update-types: [minor, patch]

  # The Dockerfile's golang and distroless bases.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      base-images:
        patterns: ["*"]
        update-types: [minor, patch]

  # compose.tools.yaml (the development tools) and ci/compose.stub.yaml (the stand-in platform).
  - package-ecosystem: docker-compose
    directories: ["/", "/ci"]
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      tool-images:
        patterns: ["*"]
        update-types: [minor, patch]
    ignore:
      # The stand-in platform's locally built image; nothing to update.
      - dependency-name: commerce-backend
      # Follow the platform's Postgres major, never ahead of it.
      - dependency-name: postgres
        update-types: ["version-update:semver-major"]

  # The SDK package (sdk/).
  - package-ecosystem: npm
    directory: /sdk
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      sdk:
        patterns: ["*"]
        update-types: [minor, patch]
    ignore:
      # TypeScript stays on 6.0 (commerce#3 DE-3): TypeScript 7 ships no compiler API, which
      # openapi-typescript needs to generate the SDK. Lift this when openapi-typescript supports 7.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
