# The development tools `make` runs, pinned by digest like every other image. A separate project, so it
# never touches the platform's. Each tool has no network and runs hardened; the read-only ones see the
# checkout read-only.
name: commerce-backend-tools

x-tool: &tool
  read_only: true
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  init: true
  network_mode: none
  user: "${UID:-1000}:${GID:-1000}"
  working_dir: /src
  tmpfs: ["/tmp:size=256m"]
  volumes:
    - { type: bind, source: ., target: /src, read_only: true, bind: { create_host_path: false } }

services:
  # Writes generated code, so it alone mounts the checkout read-write.
  sqlc:
    <<: *tool
    image: sqlc/sqlc:1.31.1@sha256:70f53171d27b2424e9358869975455a6e955a5aa8e58a998a270a6e34e525537
    volumes:
      - { type: bind, source: ., target: /src, bind: { create_host_path: false } }
