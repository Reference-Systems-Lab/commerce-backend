version: "2"

linters:
  enable:
    - bodyclose
    - depguard
    - errorlint
    - forbidigo
    - gosec
    - misspell
    - noctx
    - nilerr
  settings:
    forbidigo:
      analyze-types: true
      forbid:
        # Business code reads time through the Clock port, so billing can run on a moved clock and tests
        # can fix the time (AGENTS.md; ADR 0001).
        - pattern: ^time\.Now$
          msg: read the time through internal/platform/clock
    depguard:
      rules:
        main:
          deny:
            - pkg: github.com/lib/pq
              desc: use pgx (ADR 0001)
            - pkg: github.com/pkg/errors
              desc: use the standard library's errors and fmt.Errorf("%w")
            - pkg: log$
              desc: use log/slog
  exclusions:
    presets: [std-error-handling]
    rules:
      # The clock package is where time.Now belongs; tests measure real durations.
      - path: internal/platform/clock/
        linters: [forbidigo]
      - path: _test\.go
        linters: [forbidigo, gosec, noctx]
      - path: internal/catalog/store/ # generated by sqlc
        linters: [gosec]

formatters:
  enable: [gofmt, goimports]
  settings:
    goimports:
      local-prefixes: [github.com/Reference-Systems-Lab/commerce-backend]
