# A stand-in for the platform, so CI can prove compose.platform.yaml works the way the platform uses it:
# included together with a wiring file, next to a Postgres the backend doesn't define. Mirrors the
# platform's Postgres (commerce-platform compose.yaml) and its include (P-D2).
name: commerce-backend-ci

include:
  - path: [../compose.platform.yaml, compose.wiring.yaml]

services:
  postgres:
    image: postgres:18.6-trixie@sha256:74935e72241653ca55e0414067e6d8763aceb8a810eb51b452253ec3dcfc4336
    user: "999:999"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    init: true
    environment:
      POSTGRES_USER: commerce
      POSTGRES_DB: commerce
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets: [postgres_password]
    tmpfs: ["/tmp:size=64m", "/var/run/postgresql:uid=999,gid=999,size=1m", "/var/lib/postgresql:uid=999,gid=999"]
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "commerce", "-d", "commerce"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 60s
      start_interval: 1s

secrets:
  postgres_password:
    file: ${CI_SECRETS_DIR:?}/postgres_password
