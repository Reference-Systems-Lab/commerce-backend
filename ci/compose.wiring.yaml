# Stands in for the platform's compose/compose.backend.yaml: the image (here a local build instead of a
# digest), the networks, the order, and the one port CI curls (the platform's proxy reaches the API on
# `edge` instead).
services:
  backend-migrate:
    image: commerce-backend:ci
    pull_policy: never
    networks: [data]
    depends_on:
      postgres: { condition: service_healthy }

  backend-api:
    image: commerce-backend:ci
    pull_policy: never
    networks: [data, edge]
    depends_on:
      backend-migrate: { condition: service_completed_successfully }
    ports: ["127.0.0.1:18080:8080"]
